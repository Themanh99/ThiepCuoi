# Chuyển request vào ứng dụng. Không đặt add_header ở đây (xem thiepcuoi.conf.template).
proxy_pass http://172.30.86.2:8686;
proxy_http_version 1.1;

# Ghi đè mọi header định danh: client không giả được IP. Thiếu X-Real-IP thì /setup sẽ mở.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header CF-Connecting-IP "";
proxy_set_header CF-Ray "";
proxy_set_header Connection "";

# Header bảo mật do nginx đặt, tránh trùng với ứng dụng
proxy_hide_header X-Powered-By;
proxy_hide_header Host;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;

proxy_connect_timeout 5s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Nhận đủ file upload rồi mới chuyển: client chậm không giữ worker PHP (chỉ có 4 worker)
proxy_request_buffering on;
# ZIP album có thể vài GB: chuyển thẳng, không ghi tạm vào tmpfs
proxy_max_temp_file_size 0;
