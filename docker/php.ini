; php.ini tùy chỉnh cho Docker – Ảnh Cưới
; Khớp tham số trong run_mac.sh và php/php.ini (Windows)

date.timezone = Asia/Ho_Chi_Minh
upload_max_filesize = 64M
post_max_size = 70M
memory_limit = 512M
max_file_uploads = 50
max_input_vars = 5000
max_execution_time = 300

expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/anhcuoi/database/php_error.log

; Không cho PHP gọi mạng ra ngoài hay chạy chương trình khác
allow_url_fopen = Off
allow_url_include = Off
disable_functions = curl_init,curl_multi_init,curl_exec,fsockopen,pfsockopen,stream_socket_client,exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,mail
